name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "stg", "dev" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stg' || github.ref == 'refs/heads/dev'
    environment: ${{ github.ref_name }}
    
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          REGISTRY: ${{ env.REGISTRY }}
          ENV: ${{ vars.ENV }}
          PORT: ${{ vars.PORT }}
          CONTAINER: ${{ vars.CONTAINER }}
          OPENAI_URL: ${{ secrets.OPENAI_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SESSION_TTL_SECONDS: ${{ secrets.SESSION_TTL_SECONDS }}
        run: |
          # Deploy commands
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << EOF
            echo "🔑 Logging to GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "📦 Pulling image..."
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            
            echo "🛑 Stopping old container..."
            docker stop $CONTAINER 2>/dev/null || true
            docker rm $CONTAINER 2>/dev/null || true
            
            echo "🚀 Starting new container on port $PORT..."
            docker run -d \
              --name $CONTAINER \
              --restart unless-stopped \
              -p $PORT:3000 \
              -e ENV=$ENV \
              -e PORT=3000 \
              -e OPENAI_URL=$OPENAI_URL \
              -e OPENAI_API_KEY=$OPENAI_API_KEY \
              -e OPENAI_MODEL=$OPENAI_MODEL \
              -e REDIS_URL=$REDIS_URL \
              -e SESSION_TTL_SECONDS=$SESSION_TTL_SECONDS \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              ghcr.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            
            echo "✅ Deployment complete!"
            echo "📋 Container status:"
            docker ps | grep $CONTAINER
          EOF